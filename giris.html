<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Giriş — Defter</title>
<meta name="description" content="Defter'e giriş yap.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBFBF9">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="giris">
  <div class="giris-kutu">
    <h1 class="giris-marka">Defter</h1>
    <p class="giris-alt">Kişisel borç &amp; alacak takibi</p>

    <form id="girisForm" novalidate>
      <div class="alan">
        <label for="gKullanici">Kullanıcı adı</label>
        <input id="gKullanici" name="kullanici" type="text" required
               autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="alan">
        <label for="gSifre">Şifre</label>
        <input id="gSifre" name="sifre" type="password" required autocomplete="current-password">
      </div>
      <p class="giris-hata" id="girisHata" role="alert" hidden>Kullanıcı adı veya şifre hatalı.</p>
      <button type="submit" class="btn btn-ana giris-btn">Giriş yap</button>
    </form>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/giris.js"></script>
</body>
</html>
